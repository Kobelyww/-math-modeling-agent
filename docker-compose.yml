services:
  web:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    ports:
      - "${ZH_WEB_PORT:-8000}:8000"
    env_file:
      - ${ZH_COMPOSE_ENV_FILE:-zhihu_fiction/.env.production.example}
    environment:
      - ZH_APP_ENV=production
      - ZH_REQUIRE_AUTH=true
      - ZH_QUEUE_BACKEND=redis
      - ZH_VIDEO_QUEUE_BACKEND=redis
      - ZH_ASSET_BACKEND=minio
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
      - minio

  video-worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    command: ["python", "-m", "zhihu_fiction.app.services.drama_video_worker"]
    env_file:
      - ${ZH_COMPOSE_ENV_FILE:-zhihu_fiction/.env.production.example}
    environment:
      - ZH_APP_ENV=production
      - ZH_REQUIRE_AUTH=true
      - ZH_QUEUE_BACKEND=redis
      - ZH_VIDEO_QUEUE_BACKEND=redis
      - ZH_ASSET_BACKEND=minio
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
      - minio

  redis:
    image: redis:7-alpine
    ports:
      - "${ZH_REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${ZH_MINIO_API_PORT:-9000}:9000"
      - "${ZH_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./.docker-data/minio:/data
